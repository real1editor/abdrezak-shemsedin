<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Rosemary oil commercial campaign cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181512"/>
      <stop offset="0.5" stop-color="#1e1712"/>
      <stop offset="1" stop-color="#241b13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#c5a880" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c5a880" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a4a" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#e2bd98" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#c5a880" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6f5d4f" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5a880"/>
      <stop offset="1" stop-color="#6f5d4f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c5a880" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Bottle -->
  <g transform="translate(556 250)">
    <rect x="-58" y="-92" width="116" height="196" rx="18" fill="url(#glass)" stroke="#e2bd98" stroke-opacity="0.45"/>
    <rect x="-30" y="-124" width="60" height="36" rx="7" fill="#1a1613" stroke="#c5a880" stroke-opacity="0.55"/>
    <rect x="-24" y="-118" width="48" height="9" rx="4" fill="#c5a880" fill-opacity="0.45"/>
    <rect x="-40" y="-26" width="80" height="86" rx="8" fill="#12100e" fill-opacity="0.5" stroke="#c5a880" stroke-opacity="0.25"/>
    <text x="0" y="6" text-anchor="middle" fill="#e2bd98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ROSEMARY</text>
    <text x="0" y="26" text-anchor="middle" fill="#b4a294" font-family="ui-monospace, monospace" font-size="8" letter-spacing="3">OIL</text>
    <path d="M-34 34h68" stroke="#c5a880" stroke-opacity="0.4"/>
    <path d="M-34 42h44" stroke="#c5a880" stroke-opacity="0.2"/>
  </g>

  <!-- Botanical sprigs -->
  <g stroke="url(#leaf)" stroke-width="2" fill="none">
    <path d="M330 360c-30-66-18-128 28-184"/>
    <path d="M342 300c-24-6-40-22-46-44"/>
    <path d="M352 262c22-8 36-26 40-50"/>
    <path d="M336 332c-28 0-50-10-64-30"/>
  </g>
  <g fill="url(#leaf)" fill-opacity="0.55">
    <ellipse cx="296" cy="254" rx="7" ry="18" transform="rotate(-38 296 254)"/>
    <ellipse cx="392" cy="212" rx="7" ry="18" transform="rotate(32 392 212)"/>
    <ellipse cx="272" cy="302" rx="6" ry="15" transform="rotate(-52 272 302)"/>
    <ellipse cx="354" cy="228" rx="6" ry="16" transform="rotate(20 354 228)"/>
    <ellipse cx="318" cy="348" rx="6" ry="15" transform="rotate(-30 318 348)"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="404" fill="#c5a880" font-size="12" font-weight="700" letter-spacing="4">COMMERCIAL CAMPAIGN</text>
    <text x="64" y="442" fill="#f3ece5" font-size="38" font-weight="700" letter-spacing="-1">Rosemary Oil</text>
    <text x="64" y="468" fill="#b4a294" font-size="14" letter-spacing="0.4">Hook · Grade · Sound · Social cutdowns</text>
  </g>

  <rect x="64" y="72" width="44" height="3" fill="#c5a880"/>
  <text x="736" y="80" text-anchor="end" fill="#94806f" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">VIDEO / 2026</text>
</svg>
