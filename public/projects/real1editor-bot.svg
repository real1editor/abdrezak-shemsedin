<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Real1Editor Telegram bot and Mini App cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181512"/>
      <stop offset="0.5" stop-color="#1e1712"/>
      <stop offset="1" stop-color="#241b13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#c5a880" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#c5a880" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5a880" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c5a880" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c5a880" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Bot head -->
  <g transform="translate(530 170)">
    <rect x="-52" y="-42" width="104" height="88" rx="24" fill="#1a1613" stroke="#c5a880" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="-22" cy="-4" r="8" fill="#e2bd98"/>
    <circle cx="22" cy="-4" r="8" fill="#e2bd98"/>
    <path d="M-20 22c12 8 28 8 40 0" fill="none" stroke="#c5a880" stroke-width="2" stroke-linecap="round"/>
    <path d="M0-42v-18" stroke="#c5a880" stroke-width="2"/>
    <circle cx="0" cy="-64" r="6" fill="#e2bd98"/>
  </g>

  <!-- Chat bubbles -->
  <g>
    <rect x="92" y="126" width="250" height="62" rx="18" fill="url(#bubble)" stroke="#c5a880" stroke-opacity="0.26"/>
    <rect x="112" y="146" width="176" height="7" rx="3.5" fill="#d4c5b9" fill-opacity="0.75"/>
    <rect x="112" y="163" width="122" height="6" rx="3" fill="#94806f" fill-opacity="0.8"/>

    <rect x="176" y="208" width="286" height="78" rx="18" fill="#1a1613" stroke="#c5a880" stroke-opacity="0.4"/>
    <rect x="198" y="230" width="210" height="7" rx="3.5" fill="#e2bd98" fill-opacity="0.9"/>
    <rect x="198" y="247" width="152" height="6" rx="3" fill="#b4a294" fill-opacity="0.8"/>
    <rect x="198" y="264" width="184" height="6" rx="3" fill="#94806f" fill-opacity="0.7"/>

    <rect x="92" y="310" width="212" height="58" rx="18" fill="url(#bubble)" stroke="#c5a880" stroke-opacity="0.26"/>
    <rect x="112" y="330" width="140" height="7" rx="3.5" fill="#d4c5b9" fill-opacity="0.7"/>
    <rect x="112" y="347" width="92" height="6" rx="3" fill="#94806f" fill-opacity="0.8"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="404" fill="#c5a880" font-size="12" font-weight="700" letter-spacing="4">TELEGRAM · MINI APP</text>
    <text x="64" y="442" fill="#f3ece5" font-size="38" font-weight="700" letter-spacing="-1">Real1Editor Bot</text>
    <text x="64" y="468" fill="#b4a294" font-size="14" letter-spacing="0.4">Automation · Orders · Client workflows</text>
  </g>

  <rect x="64" y="72" width="44" height="3" fill="#c5a880"/>
  <text x="736" y="80" text-anchor="end" fill="#94806f" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">AI / 2026</text>
</svg>
