<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Biometric attendance system cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181512"/>
      <stop offset="0.5" stop-color="#1e1712"/>
      <stop offset="1" stop-color="#241b13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c5a880" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c5a880" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5a880" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e2bd98" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c5a880" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#c5a880" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Scan frame -->
  <g fill="none" stroke="#c5a880" stroke-width="2" stroke-linecap="round">
    <path d="M330 118h-46v46M470 118h46v46M330 382h-46v-46M470 382h46v-46"/>
  </g>
  <rect x="300" y="130" width="200" height="240" rx="20" fill="#12100e" fill-opacity="0.35" stroke="#c5a880" stroke-opacity="0.18"/>

  <!-- Face landmarks -->
  <g fill="none" stroke="#c5a880" stroke-opacity="0.55" stroke-width="1.2">
    <ellipse cx="400" cy="242" rx="62" ry="78"/>
    <path d="M368 214c10-10 22-14 32-14s22 4 32 14"/>
    <path d="M370 238c8-4 16-4 24 0M406 238c8-4 16-4 24 0"/>
    <path d="M400 240v28l-10 8h20"/>
    <path d="M376 300c14 8 34 8 48 0"/>
  </g>
  <g fill="#e2bd98">
    <circle cx="382" cy="240" r="3"/>
    <circle cx="418" cy="240" r="3"/>
    <circle cx="400" cy="270" r="2.5"/>
    <circle cx="382" cy="300" r="2.5"/>
    <circle cx="400" cy="306" r="2.5"/>
    <circle cx="418" cy="300" r="2.5"/>
  </g>

  <rect x="300" y="252" width="200" height="2" fill="url(#scan)"/>

  <!-- ID card -->
  <g transform="translate(556 190)">
    <rect width="164" height="104" rx="12" fill="#1a1613" stroke="#c5a880" stroke-opacity="0.3"/>
    <circle cx="34" cy="40" r="16" fill="#c5a880" fill-opacity="0.16" stroke="#c5a880" stroke-opacity="0.5"/>
    <path d="M22 58c4-10 20-10 24 0" fill="none" stroke="#c5a880" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="62" y="28" width="74" height="7" rx="3.5" fill="#c5a880" fill-opacity="0.55"/>
    <rect x="62" y="44" width="52" height="5" rx="2.5" fill="#94806f" fill-opacity="0.6"/>
    <rect x="18" y="78" width="128" height="6" rx="3" fill="#c5a880" fill-opacity="0.2"/>
    <circle cx="146" cy="18" r="5" fill="#c5a880"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="404" fill="#c5a880" font-size="12" font-weight="700" letter-spacing="4">COMPUTER VISION</text>
    <text x="64" y="442" fill="#f3ece5" font-size="38" font-weight="700" letter-spacing="-1">Biometric Attendance</text>
    <text x="64" y="468" fill="#b4a294" font-size="14" letter-spacing="0.4">OpenCV · Face embeddings · FastAPI</text>
  </g>

  <rect x="64" y="72" width="44" height="3" fill="#c5a880"/>
  <text x="736" y="80" text-anchor="end" fill="#94806f" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">ML / 2026</text>
</svg>
